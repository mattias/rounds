<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16181f">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon180.png">
<link rel="icon" href="icons/icon128.png">
<title>Rounds</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <img src="icons/icon128.png" alt="" width="36" height="36">
  <div><h1>Rounds</h1><div id="tagline"></div></div>
</header>
<form id="form" autocomplete="off">
  <input id="url" type="text" inputmode="url" autocapitalize="off" spellcheck="false">
  <button type="button" id="paste" title="Paste">📋</button>
  <button id="load" class="primary"></button>
</form>
<nav id="tabs" style="display:none"></nav>
<div id="player-wrap"><div id="player-host"></div></div>
<div id="local-wrap"><video id="lv" playsinline controls></video><div class="lbar" id="lbar-top"></div><div class="lbar" id="lbar-bottom"></div><div id="lsub"></div></div>
<input id="lfile" type="file" multiple hidden accept="video/*,audio/*,.mkv,.srt,.vtt,.ass,.ssa">
<main id="ui"></main>
<script src="shared.js"></script>
<script src="core.js"></script>
<script src="subs.js"></script>
<script src="embed.js"></script>
<script src="app.js"></script>
</body>
</html>
